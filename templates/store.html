<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <h1 class="text-center">This is 點餐外送平台 for store</h1>
                <a href="/view_menu"><button>菜單列表</button></a>
                <a href="/"></a>
            <main>

      
                <section id="menu">
                    <h2>我的訂單</h2>
                    <table border="1">
                        <tr>
                            <th>訂單編號</th>
                            <th>內容</th>
                            <th>單價</th>
                            <th>點餐時間</th>
                            <th>數量</th>
                            <th>總價</th>
                            <th>目的地</th>
                            <th>操作</th>
                        </tr>
                        <!-- 範例 -->
                         {%for rec in data%}
                        <tr>
                            <td>{{ rec.id }}</td>
                            <td>{{ rec.m_name }}</td>
                            <td>{{ rec.price }}</td>
                            <td>{{ rec.time }}</td>
                            <td>{{ rec.quantity}}</td>
                            <td>{{ rec.total }}</td>
                            <td>{{ rec.destination }}</td>
                            <td><a href="/menu-order-complete?id={{ rec.id }}"><button>訂單完成</button></a></td>
                        </tr>
                        {%endfor%}
                    </table>
                </section>
            </main>
        </div>
    </div>
    
</body>
</html>
